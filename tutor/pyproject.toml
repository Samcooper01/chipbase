[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "chipbase-tutor"
version = "0.1.1"
description = "An MCP (Model Context Protocol) server that turns a passage highlighted on Chipbase into the context a model needs to explain it."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["mcp>=2.2,<3"]

[project.scripts]
chipbase-tutor = "chipbase_tutor.server:main"

[tool.setuptools]
packages = ["chipbase_tutor"]
