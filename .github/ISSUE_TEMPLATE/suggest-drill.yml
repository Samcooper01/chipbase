name: Suggest a drill
description: Ask for a drill that does not exist yet, send a question for one that does, or name a topic the games never touch.
title: "Suggestion: "
labels: ["suggestion"]
body:
  - type: markdown
    attributes:
      value: |
        A question only goes live once its answer can be checked, so the most
        useful part of a suggestion is where the answer comes from.
  - type: input
    id: kind
    attributes:
      label: What is it?
      description: A new drill, a question for an existing drill, or a topic.
  - type: input
    id: drill
    attributes:
      label: Which drill, if it belongs to one
  - type: textarea
    id: detail
    attributes:
      label: The detail
      description: What the question asks, what the right answer is, and why the wrong answers are wrong.
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Where the answer can be checked
      description: A tool log, a run you can describe, a manual page, a standard.
