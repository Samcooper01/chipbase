name: Flag a question
description: Something in a drill looks wrong - a question, an answer, or an explanation.
title: "Flag: "
labels: ["flag"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for flagging this. The flag button on the drill fills in the
        first three fields; say in the last one what looks wrong.
  - type: input
    id: drill
    attributes:
      label: Drill
      description: Which drill the item is in.
    validations:
      required: true
  - type: input
    id: item
    attributes:
      label: Item
      description: The id of the card or question.
    validations:
      required: true
  - type: input
    id: page
    attributes:
      label: Page
      description: The page you were on.
  - type: textarea
    id: note
    attributes:
      label: What looks wrong?
      description: The more specific, the quicker the fix. If you know the right answer and where it can be checked, say so.
    validations:
      required: true
