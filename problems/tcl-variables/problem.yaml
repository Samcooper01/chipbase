id: tcl-variables
title: "Basics 1: variables and printing"
topic: Scripting Basics
difficulty: easy
points: 50
engine: script
kind: files
order: 1
editable:
  - path: script.tcl
    language: tcl
checks:
  - id: lines
    label: "Printed exactly 3 lines"
    metric: lines_printed
    op: "~="
    value: 3
    tolerance: 0.1
  - id: exact
    label: "Output matches exactly"
    metric: output_correct
    op: "~="
    value: 1
    tolerance: 0.1
