  - id: lf-exception-silence
    section: timing
    stage: 3_5_place_dp
    question: The setup check is clean and repair found nothing. What would you verify?
    hint: "Every earlier sign of an untimed design is absent here. What else could empty the reports?"
    answer: Whether an exception has removed the paths from the analysis.
    wrong:
      - The clock period, since a loose one makes everything pass.
      - The library, since a missing timing arc would hide paths.
      - "Nothing: a clean check with no violations is the result."
    explain: >-
      This run carries a false path from the clock to itself, which removes
      every register-to-register path in the design. Unlike an undefined clock,
      it leaves no unclocked pins and no unconstrained endpoints, so the checks
      that catch the other mistakes say nothing. Counting the paths that were
      timed, or reporting the exceptions, is what finds it.
    fix: |-
      report_checks -path_delay max -group_path_count 1000 | grep -c Startpoint
      report_exceptions
    source: ""
    excerpt: |2-

      ==========================================================================
      Floorplan check_setup
      --------------------------------------------------------------------------
      number instances in verilog is 521
      [INFO IFP-0107] Defining die area using utilization: 55.00% and aspect ratio: 1.
      [WARNING IFP-0028] Core area lower left (1.000, 1.000) snapped to (1.140, 1.400).
      [INFO IFP-0001] Added 24 rows of 182 site FreePDK45_38x28_10R_NP_162NW_34O.
              ...
      [WARNING EST-0027] no estimated parasitics. Using wire load models.
      [INFO RSZ-0100] Repair move sequence: UnbufferMove SizeUpMove SwapPinsMove
      [INFO RSZ-0098] No setup violations found
      [INFO RSZ-0505] Runtime: 0.03s

  - id: lf-too-much-room
    section: placement
    stage: 6_report
    question: This run closed with room to spare. What did the spare room cost?
    hint: "Compare the wire length and the area with a run of the same design at 57 percent."
    answer: Longer wires, and the buffers repair added to drive them.
    wrong:
      - "Nothing measurable: a larger die only wastes silicon."
      - A longer runtime, since the placer has more space to search.
      - More congestion, since the wires are spread over more tiles.
    explain: >-
      The same netlist at 57 percent utilization routes 3605 micrometres of
      wire and finishes at 716 square micrometres of cells. Here the core is
      seven times larger, the wire length is 6098, and the cell area has grown
      to 767 because timing repair had to drive those longer wires. Too much
      room is a real cost, not just a wasted one.
    fix: |-
      export CORE_UTILIZATION = 55
    source: gpl
    excerpt: |2-
      [INFO IFP-0100] Die BBox:  (  0.000  0.000 ) ( 93.045 93.045 ) um
      [INFO IFP-0101] Core BBox: (  1.140  1.400 ) ( 91.960 91.000 ) um
      [INFO IFP-0102] Core area:                         8137.472 um^2
      [INFO IFP-0103] Total instances area:               663.138 um^2
      [INFO IFP-0104] Effective utilization:                0.081
      [INFO IFP-0105] Number of instances:                    521
              ...
      Total wire length = 6098 um.
      Design area 767 um^2 9% utilization.

  - id: lf-pin-layers
    section: placement
    stage: 3_2_place_iop
    question: Pin placement stopped. What was it told to do?
    hint: "The command is printed above the error, with both of its arguments."
    answer: Place the ports on layers the technology does not have.
    wrong:
      - Place the ports on layers reserved for the power grid.
      - Place the ports before the floorplan had created any tracks.
      - Place the ports on a layer with no tracks in that direction.
    explain: >-
      The port placer is told which layers to use for horizontal and vertical
      pins, and it checks the names against the technology. The choice matters
      beyond spelling: a layer too low makes the pins hard for the router to
      reach, and one too high wastes the upper stack. Both names here are
      simply wrong, which the tool says plainly.
    fix: |-
      export IO_PLACER_H = metal3
      export IO_PLACER_V = metal2
    source: ppl
    excerpt: |2-
      Found 0 macro blocks.
      Using 2 tracks default min distance between IO pins.
      [ERROR PPL-0051] Layer metalX not found.
      Error: io_placement.tcl, 21 PPL-0051
      Elapsed time: 0:00.21[h:]min:sec. CPU time: user 0.17 sys 0.04 (100%). Peak memory: 113920KB.
      make[1]: *** [Makefile:460: do-3_2_place_iop] Error 1
      make: *** [Makefile:460: results/nangate45/gcd/bad_pins/3_2_place_iop.odb] Error 2

  - id: lf-cts-buffer-spacing
    section: cts
    stage: 4_1_cts
    question: The spacing between clock buffers was set to one micrometre. What did that do?
    hint: "Compare seven buffers and a minimum depth of three against five and two."
    answer: More buffers and a deeper tree, on a block too small to need either.
    wrong:
      - Fewer buffers, since each one now covers a shorter distance.
      - A shallower tree, since the buffers sit closer to the sinks.
      - "Nothing measurable: the spacing is advisory, not a rule."
    explain: >-
      The default run of this design builds five buffers with a minimum depth
      of two. Forcing one every micrometre gives seven and a depth of three,
      and the design area grows from 716 to 764 square micrometres. Depth costs
      variation and power. The knob is there for large blocks with long clock
      runs, and it does harm on a small one.
    fix: |-
      # leave the spacing to the tool unless the tree is genuinely long
      export CTS_BUF_DISTANCE = 60
    source: cts
    excerpt: |2-
      clock_tree_synthesis -sink_clustering_enable -repair_clock_nets -distance_between_buffers 1
              ...
      [INFO CTS-0021]  Distance between buffers: 0 units (1 um).
      [INFO CTS-0035]  Number of sinks covered: 35.
      [INFO CTS-0018]     Created 7 clock buffers.
      [INFO CTS-0012]     Minimum number of buffers in the clock path: 3.
      [INFO CTS-0013]     Maximum number of buffers in the clock path: 3.
      [INFO CTS-0015]     Created 7 clock nets.

  - id: lf-multiple-drivers
    section: synthesis
    stage: 1_2_yosys
    question: The error is at the end. Which line above it is the cause?
    hint: "The error says a check failed. The check printed what it found one step earlier."
    answer: The warning, which says one signal has two drivers.
    wrong:
      - The buffer insertion pass, which created a driver that clashes.
      - The technology mapping, which produced a cell with two outputs.
      - The splitting of multi-bit signals, which duplicated a net.
    explain: >-
      A net with two drivers has no defined value, so the check refuses to pass
      the netlist on. The error line itself says only that a check failed; the
      detail is in the warning above, which names the signal and both of the
      things driving it. One of them here is a module input, which usually
      means an output was assigned a name that already belongs to a port.
    fix: |-
      // drive each net from exactly one place
      assign clash = req_val;
    source: ""
    excerpt: |2-
      14. Executing INSBUF pass (insert buffer cells for connected wires).
      15. Executing CHECK pass (checking for obvious problems).
      Warning: multiple conflicting drivers for gcd.\resp_rdy:
          port Z[0] of cell $auto$insbuf.cc:97:execute$2712 (BUF_X1)
          module input resp_rdy[0]
      16. Printing statistics.
      17. Executing CHECK pass (checking for obvious problems).
      ERROR: Found 1 problems in 'check -assert'.

  - id: lf-placer-congestion
    section: routing
    stage: 3_1_place_gp
    question: Global placement printed this, before any routing ran. What is it?
    hint: "Ask how a placer could know anything about congestion at all."
    answer: The placer's own estimate of how routable its placement is.
    wrong:
      - The router's congestion, reported back for the placer to fix.
      - The share of routing tracks that the placement has used up.
      - The overflow left over after the placer stopped improving.
    explain: >-
      A placer in routability mode runs a quick trial route and reads the
      overflow back, which is how it knows to spread cells apart before the
      real router ever starts. The averages of the worst tiles matter far more
      than the overall figure: congestion is local, and a design with an
      average of 0.72 and a handful of tiles at 1.0 is the one that fails.
    fix: |-
      # if the top percentiles are near or above 1, spread the design out
      export PLACE_DENSITY_LB_ADDON = 0.30
    source: gpl
    excerpt: |2-
      [INFO GPL-0041] Total routing overflow: 0.0000
      [INFO GPL-0042] Number of overflowed tiles: 0 (0.00%)
      [INFO GPL-0043] Average top 0.5% routing congestion: 0.7465
      [INFO GPL-0044] Average top 1.0% routing congestion: 0.7361
      [INFO GPL-0045] Average top 2.0% routing congestion: 0.7240
      [INFO GPL-0046] Average top 5.0% routing congestion: 0.6931
      [INFO GPL-0047] Routability iteration weighted routing congestion: 0.7413

  - id: lf-drt-convergence
    section: routing
    stage: 5_2_route
    question: Detailed routing on a larger design. Is this going to finish?
    hint: "Look at the ratio between one pass and the next, not at the first number."
    answer: "Yes: each pass clears most of what the one before it left."
    wrong:
      - "No: five thousand violations means the design cannot be routed."
      - "No: the third pass barely improved, so it has stopped converging."
      - "Cannot tell: the counts are per pass and do not accumulate."
    explain: >-
      The shape is what matters. Five thousand becomes two thousand, then two
      thousand becomes a hundred, and the last pass finishes clean, which is a
      router that is winning. The pass to worry about is one that returns
      almost the same number as the pass before it, over and over: that is a
      design the router cannot fix by rerouting, and it needs the placement or
      the floorplan changed instead.
    fix: |-
      # nothing here; read the trajectory before reacting to the first number
      grep "Number of violations" 5_2_route.log
    source: drt
    excerpt: |2-
      [INFO DRT-0195] Start 0th optimization iteration.
      [INFO DRT-0199]   Number of violations = 5434.
      [INFO DRT-0195] Start 1st optimization iteration.
      [INFO DRT-0199]   Number of violations = 2304.
      [INFO DRT-0195] Start 2nd optimization iteration.
      [INFO DRT-0199]   Number of violations = 1925.
      [INFO DRT-0195] Start 3rd optimization iteration.
      [INFO DRT-0199]   Number of violations = 100.
      [INFO DRT-0195] Start 4th guides tiles iteration.
      [INFO DRT-0199]   Number of violations = 0.

  - id: lf-disk-full
    section: infra
    stage: 2_4_floorplan_pdn
    question: The grid was built, and then this. What would you check first?
    hint: "Read what the tool was doing when it failed, not what it was doing before."
    answer: Whether there is room on the disk to write the file.
    wrong:
      - Whether the database from the previous stage is corrupt.
      - Whether the power grid definition produced an illegal shape.
      - Whether another run is writing to the same results directory.
    explain: >-
      The grid was inserted and the area reported, so the work succeeded. The
      failure is in closing the file it was written to, and a stream error on
      close is what a full disk looks like from inside a program. Nothing in
      the message says disk, which is exactly why this one is worth
      recognizing: check the filesystem before you doubt the design.
    fix: |-
      df -h .
      make clean_all   # or point the flow somewhere with room
    source: ""
    excerpt: |2-
      [INFO PDN-0500] Runtime: 0.00s
      Design area 676 um^2 58% utilization.
      write_db ./results/nangate45/gcd/dfull/2_4_floorplan_pdn.odb
      Error: close for ./results/nangate45/gcd/dfull/2_4_floorplan_pdn.odb failed: basic_ios::clear: iostream error
      Error: pdn.tcl, 24 basic_ios::clear: iostream error
      Elapsed time: 0:00.38[h:]min:sec. CPU time: user 0.33 sys 0.05 (98%). Peak memory: 117448KB.
      make[1]: *** [Makefile:429: do-2_4_floorplan_pdn] Error 1
      make: *** [Makefile:429: results/nangate45/gcd/dfull/2_4_floorplan_pdn.odb] Error 2

  - id: lf-order-messages
    section: setup
    stage: any
    style: order
    question: Put these messages in the order a run prints them.
    hint: "The three letters before the number name the tool that printed it."
    items:
      - "[INFO ODB-0227] LEF file: ... created 22 layers, 27 vias"
      - "[INFO IFP-0001] Added 24 rows of 182 site FreePDK45"
      - "[INFO CTS-0008] TritonCTS found 1 clock nets."
      - "[INFO DRT-0199]   Number of violations = 0."
      - "[INFO RCX-0045] Extract 648 nets, 2366 rsegs"
    explain: >-
      The prefix is the module: reading the technology, initializing the
      floorplan, building the clock tree, detailed routing, and extraction.
      Knowing them turns a wall of output into a map, and it is how you find
      the right log without reading any of them. The full list is in the
      tool's documentation, and the codes are stable across versions.
    source: ""

  - id: lf-order-too-good
    section: timing
    stage: any
    style: order
    question: A design closes with suspiciously good timing. Put these checks in the order that finds the cause fastest.
    hint: "Each step catches a cause the step before it cannot see."
    items:
      - read the constraint log for a clock or port that was not found
      - read the floorplan check for unclocked pins and unconstrained endpoints
      - count how many paths the timer actually reported
      - report the exceptions that remove paths from the analysis
    explain: >-
      The first two are free and catch the common cases: a clock created on
      nothing, or ports with no delay. Counting the paths catches a design
      that is timed but barely. Exceptions come last because they take the
      most reading, and they are the only thing that catches a false path
      wide enough to empty the analysis while every check stays clean.
    source: ""

  - id: lf-order-hold
    section: cts
    stage: any
    style: order
    question: Hold violations appear everywhere after the clock tree. Put these in the order you would work through them.
    hint: "Rule out what you wrote before you rule out what the tool did."
    items:
      - check the hold uncertainty in the constraints
      - check the skew the clock tree actually achieved
      - confirm setup is closed, since hold fixes will slow the paths
      - let repair insert hold buffers
    explain: >-
      Everywhere at once means a common cause, and the cheapest common cause
      is a number someone typed. Skew comes next, since a badly balanced tree
      creates hold failures across a whole region. Setup has to be settled
      before hold, because the buffers hold repair inserts add delay. Only
      then is inserting buffers the right move rather than a way to hide
      something.
    source: ""

  - id: lf-out-of-memory
    section: infra
    stage: 5_2_route
    question: The router was making progress and then stopped. What happened?
    hint: "One column climbs on every line. Read that one, then read the exit code."
    answer: The machine killed it for taking too much memory.
    wrong:
      - The router reached its iteration limit and gave up.
      - The database from the previous stage was corrupt.
      - The design cannot be routed, so the tool stopped early.
    explain: >-
      There is no tool error here at all: the last line the tool wrote was a
      normal progress line at 342 megabytes, having started the stage at 267.
      An exit code in the 240s with no message is the shell reporting that
      something outside the tool ended it, and the growing memory column says
      what. On a shared machine, look at the job's memory limit before you
      look at the design.
    fix: |-
      # give the job room, or ask the router for fewer threads
      make DESIGN_CONFIG=... NUM_CORES=4
    source: ""
    excerpt: |2-
      [INFO DRT-0195] Start 0th optimization iteration.
          Completing 20% with 0 violations.
          elapsed time = 00:00:01, memory = 278.67 (MB).
          Completing 50% with 25 violations.
          elapsed time = 00:00:02, memory = 302.66 (MB).
          Completing 70% with 45 violations.
          elapsed time = 00:00:03, memory = 324.15 (MB).
          Completing 100% with 67 violations.
          elapsed time = 00:00:04, memory = 342.52 (MB).
      Elapsed time: 0:05.62[h:]min:sec. CPU time: user 15.44 sys 0.14 (277%). Peak memory: 350108KB.
      make[1]: *** [Makefile:552: do-5_2_route] Error 247
      make: *** [Makefile:552: results/nangate45/gcd/oom/5_2_route.odb] Error 2

  - id: lf-drc-clean
    section: signoff
    stage: 6_drc
    question: The design-rule count is zero. What has that proved?
    hint: "Read what the report says about itself before reading its result."
    answer: That this deck's rules found nothing, which is narrower than clean.
    wrong:
      - That the layout obeys every rule of the process.
      - That the checker ran without an error of its own.
      - That the layout is identical to the one the foundry would accept.
    explain: >-
      The report names the deck it came from and lists the rules it knows,
      each with its own description. An open deck implements a subset of what
      a foundry's sign-off deck checks, so a zero means only that the subset
      passed. The number itself is counted by matching markers in the report
      database, which is why the count file and the database must be read
      together.
    fix: |-
      # know which rules your deck implements before trusting the count
      grep -c "<category>" 6_drc.lyrdb
    source: ""
    excerpt: |2-
      $ cat reports/sky130hd/gcd/6_drc_count.rpt
      0

      $ head reports/sky130hd/gcd/6_drc.lyrdb
      <report-database>
       <description>SKY130 DRC runset</description>
       <original-file/>
       <generator>drc: script='/OpenROAD-flow-scripts/flow/platforms/sky130hd/drc/sky130hd.lydrc'</generator>
       <top-cell>gcd</top-cell>
       <tags>
       </tags>
       <categories>
        <category>
         <name>li.1</name>
         <description>li.1 : min. li width : 0.17um</description>
         <categories>
         </categories>

  - id: lf-lvs-did-not-run
    section: signoff
    stage: 6_lvs
    question: Did layout versus schematic find a mismatch?
    hint: "Ask what stage of the check this message comes from."
    answer: "No: it stopped while reading the netlist, before comparing."
    wrong:
      - "Yes: a device in the layout has no matching device in the netlist."
      - "Yes: a resistor's value differs between the two."
      - "No: the layout matched, and this is a warning about the netlist."
    explain: >-
      The comparison never started. The reader hit a passive device with no
      value on it and gave up, which usually means the netlist handed to the
      check was assembled wrongly rather than that the design is wrong. A
      check that did not run is not a check that passed, and it is worth being
      strict about the difference: the line to look at is the one the error
      names.
    fix: |-
      sed -n '5740p' 6_final_concat.cdl
    source: ""
    excerpt: |2-
      KLayout 0.30.7
      ERROR: In /OpenROAD-flow-scripts/flow/platforms/sky130hd/lvs/sky130hd.lylvs: Can't find a value for a R, C or L device in /OpenROAD-flow-scripts/flow/objects/sky130hd/gcd/sky_signoff/6_final_concat.cdl, line 5740 in Netlist::read
      ERROR: RuntimeError: Can't find a value for a R, C or L device in /OpenROAD-flow-scripts/flow/objects/sky130hd/gcd/sky_signoff/6_final_concat.cdl, line 5740 in Netlist::read in Executable::execute

  - id: lf-ir-drop
    section: signoff
    stage: 6_report
    question: The same design on the default grid drops 0.38 percent. What does this run tell you?
    hint: "The power is the same in both runs. Only one thing changed."
    answer: The grid is carrying the same current through less metal.
    wrong:
      - The design is drawing three times the current it was.
      - The supply voltage was set too low for this library.
      - The analysis used a different corner from the default run.
    explain: >-
      Total power is 2.61 milliwatts here against 2.62 in the default run, so
      the design is doing the same work. The straps were narrowed and spread
      out, and the drop tripled. A percentage of a percent is still healthy,
      since limits are usually a few percent, but the trend is what a grid
      review watches: the number means nothing without the grid and the
      activity that produced it.
    fix: |-
      # widen or tighten the straps until the drop fits the budget
      add_pdn_stripe -layer metal4 -width 1.4 -pitch 6.5 -offset 0
    source: psm
    excerpt: |2-
      [INFO PSM-0040] All shapes on net VDD are connected.
      ########## IR report #################
      Net              : VDD
      Corner           : default
      Total power      : 2.61e-03 W
      Supply voltage   : 1.10e+00 V
      Worstcase voltage: 1.09e+00 V
      Average voltage  : 1.09e+00 V
      Average IR drop  : 8.77e-03 V
      Worstcase IR drop: 1.25e-02 V
      Percentage drop  : 1.14 %
      ######################################
