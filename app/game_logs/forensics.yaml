            10* |       0 |       3 |        0 |      1 |     5 |    +0.6% |   -0.129 |       -3.9 |       -5.2 |     49 | dpath.a_reg.out[2]$_DFFE_PP_/D
            20* |       0 |      11 |        0 |      1 |     7 |    +1.2% |   -0.129 |       -3.9 |       -5.3 |     49 | dpath.a_reg.out[6]$_DFFE_PP_/D
              ...
          final |       0 |      88 |        3 |      1 |    16 |    +8.5% |   -0.120 |       -3.8 |       -5.0 |     49 | resp_msg[14]
      ------------------------------------------------------------------------------------------------------------------------------
