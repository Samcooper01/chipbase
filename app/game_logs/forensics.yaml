  - id: lf-worst-endpoint-port
    section: timing
    stage: 3_5_place_dp
    question: The worst endpoint is resp_msg[14]. What does that name tell you?
    hint: "Compare that name with the register names in the rows above it."
    answer: The worst path ends at an output port, so the budget is the suspect.
    wrong:
      - The worst path ends at a register in the response logic.
      - The worst path ends at a bus, so all its bits are failing together.
      - The worst path ends outside the block, which cannot be timed here.
    explain: >-
      Register endpoints carry the flop's name and a pin, as the rows above do.
      A bare port name means the path is checked against an output delay
      instead, which is a number someone chose. Before optimizing the logic it
      is worth asking whether the block was given a fair share of the period.
    fix: |-
      # check what the interface was promised before reoptimizing the logic
      report_checks -to [get_ports resp_msg*] -path_delay max
    source: rsz
    excerpt: |2-
      [INFO RSZ-0094] Found 49 endpoints with setup violations.
      [INFO RSZ-0099] Repairing 49 out of 49 (100.00%) violating endpoints...
